services:
  # 1. Redis Service (For Queue and Cache)
  - type: keyvalue
    name: dev-focus-redis
    ipAllowList: [] # Only allow internal service access
    plan: free

  # 2. Backend API Service
  - type: web
    name: dev-focus-api
    env: php
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dev-focus-redis
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql

  # 3. Background Worker (Queue Processing)
  - type: worker
    name: dev-focus-worker
    env: php
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan queue:work --tries=3 --timeout=90
    envVars:
      - key: APP_ENV
        value: production
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dev-focus-redis
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql

  # 4. Frontend (Ionic/Angular Static Site)
  - type: web
    name: dev-focus-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: www
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: dev-focus-api
          property: host
