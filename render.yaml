services:
  # 1. Redis Service (Internal Key-Value Store) - NEW
  - type: keyvalue
    name: dev-focus-redis
    ipAllowList: [] 
    plan: free

  # 2. Backend API Service (Existing)
  - type: web
    name: api-dev-focus # Matched with your existing service name
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dev-focus-redis
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql
      # Supabase and other sensitive variables (Render will prompt for these or keep existing)
      - key: APP_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://dev-focus.onrender.com,http://localhost:8100,http://localhost:4200"

  # 3. Background Worker (NEW for Queue Processing)
  - type: worker
    name: dev-focus-worker
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: php artisan queue:work --tries=3 --timeout=90
    envVars:
      - key: APP_ENV
        value: production
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dev-focus-redis
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql
      - key: APP_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://dev-focus.onrender.com,http://localhost:8100,http://localhost:4200"

  # 4. Frontend Service (Existing)
  - type: web
    name: dev-focus # Matched with your existing service name
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: www
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: api-dev-focus
          property: host
