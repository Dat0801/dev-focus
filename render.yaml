services:
  # 1. Redis Service (Internal Key-Value Store)
  - type: keyvalue
    name: dev-focus-redis
    ipAllowList: [] 
    plan: free

  # 2. Backend API Service (Laravel)
  - type: web
    name: dev-focus-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dev-focus-redis
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql

  # 3. Background Worker (Queue Processing)
  - type: worker
    name: dev-focus-worker
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    # Override the default entrypoint to run the queue worker
    dockerCommand: php artisan queue:work --tries=3 --timeout=90
    envVars:
      - key: APP_ENV
        value: production
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dev-focus-redis
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql

  # 4. Frontend (Ionic/Angular Static Site)
  - type: web
    name: dev-focus-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: www
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: dev-focus-api
          property: host
